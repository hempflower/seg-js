<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>seg-js · 最小时钟示例</title>
<style>
  html, body { margin: 0; height: 100%; background: #111;
               display: flex; align-items: center; justify-content: center; }
  canvas { width: min(90vw, 720px); height: min(28vw, 220px);
           background: #1a0303; border-radius: 12px; }
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <script type="module">
    import { createSegDisplay } from '../dist/index.js';

    const display = createSegDisplay(document.getElementById('cv'), {
      digits: 8,
      dots: [1, 3, 5],
    });

    const p2 = (x) => String(x).padStart(2, '0');
    const renderTime = () => {
      const now = new Date();
      const text = p2(now.getHours()) + p2(now.getMinutes()) + p2(now.getSeconds())
        + p2(Math.floor(now.getMilliseconds() / 10));
      display.update({ value: text, dots: now.getMilliseconds() < 500 ? [1, 3, 5] : [1, 3] });
    };
    renderTime();
    setInterval(renderTime, 50);
  </script>
</body>
</html>
